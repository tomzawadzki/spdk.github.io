---
layout: base
---
{% assign toc = site.data.sidebars[page.sidebar] %}
{% if toc.size > 0 %}
<div class="page-with-toc">
  <aside class="site-toc">
    <ul>
      {% for entry in toc %}
        <li>
          {% assign first_char = entry.url | slice: 0 %}
          <a href="{% if first_char == '/' %}{{ entry.url | relative_url }}{% else %}{{ entry.url }}{% endif %}">{{ entry.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </aside>

  <div class="page-content">
    <div class="page-header">
      <h1>{{ page.title }}</h1>
    </div>
    <div class="content">{{ content }}</div>
  </div>
</div>

{% else %}
<div class="page-content">
  <div class="page-header">
    <h1>{{ page.title }}</h1>
  </div>
  <div class="content">{{ content }}</div>
</div>
{% endif %}
