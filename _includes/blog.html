<section id="blog" class="blog">
    {% for post in site.posts limit: include.limit %}
      <div class="blog-section">
        <h2 class="blog-heading"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
        <div class="blog-author">{{ post.date | date: "%b %-d, %Y" }} • {{ post.author }}</div>
        <div class="content">{{ post.excerpt }}  <a href="{{ post.url | relative_url }}">Continue...</a></div>
      </div>
    {% endfor %}
  </section>
