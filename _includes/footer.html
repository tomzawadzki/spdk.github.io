<script>
(function() {
    var best = null;
    document.querySelectorAll('.nav-link[href]').forEach(function(a) {
        var h = a.pathname;
        if (a.origin !== location.origin || h === '/') return;
        var ok = h.endsWith('.html') ? location.pathname === h : location.pathname.indexOf(h) === 0;
        if (ok && (!best || h.length > best.pathname.length)) best = a;
    });
    if (best) {
        best.classList.add('active');
        best.setAttribute('aria-current', 'page');
    }
})();
</script>
